<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="40mm" viewBox="0 0 1500 400" role="img" aria-labelledby="title description">
  <title id="title">Etiqueta general Agresti.3D — 15 × 4 cm</title>
  <desc id="description">Etiqueta de marca con isotipo, frase de marca y código QR al catálogo online.</desc>
  <rect width="1500" height="400" fill="#ffffff"/>

  <rect x="20" y="20" width="510" height="360" fill="#070f1f"/>
  <rect x="20" y="20" width="12" height="360" fill="#ff6a3d"/>

  <g transform="translate(170 89) scale(.39)" fill="none" stroke="#ff6a3d" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 144 440 L 224 76 L 288 76 L 368 440" stroke-width="46"/>
    <path d="M 166 302 L 346 302" stroke-width="42"/>
  </g>
  <text x="275" y="340" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700" text-anchor="middle">AGRESTI.3D</text>

  <text x="590" y="180" fill="#070f1f" font-family="Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.2">Diseños que <tspan fill="#d23c14">cobran vida</tspan>.</text>
  <text x="590" y="300" fill="#d23c14" font-family="Arial, sans-serif" font-size="29" font-weight="700">agresti3d.web.app</text>
  <text x="590" y="347" fill="#24334b" font-family="Arial, sans-serif" font-size="24">Escaneá para ver el catálogo.</text>

  <image href="catalogo-qr.png" x="1270" y="78" width="190" height="190" preserveAspectRatio="none"/>
  <text x="1365" y="315" fill="#070f1f" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle">CATÁLOGO</text>
</svg>
