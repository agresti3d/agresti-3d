<!doctype html>
<html lang="es-AR" class="theme-noche">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Seguimiento de pedido — Agresti.3D</title>
  <meta name="description" content="Consultá el estado de tu pedido de Agresti.3D con el código que te enviamos por WhatsApp.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070f1f">
  <link rel="icon" href="/assets/icons/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/assets/pwa/icon-192.png?v=2" sizes="192x192" type="image/png">
  <link rel="icon" href="/assets/pwa/icon-512.png?v=2" sizes="512x512" type="image/png">
  <link rel="apple-touch-icon" href="/assets/pwa/icon-192.png?v=2">
  <link rel="stylesheet" href="/css/styles.css?v=36">
  <link rel="stylesheet" href="/css/theme.css">
</head>
<body>
  <header class="header">
    <div class="header__inner wrap">
      <a class="logo" href="/" aria-label="Agresti.3D, inicio">
        <img class="logo__mark" src="/assets/logo/agresti-a.svg" alt="" width="48" height="48">
        <span class="logo__name">AGRESTI<span class="logo__dot">.3D</span></span>
      </a>
      <a class="btn btn--ghost" href="/">Volver al catálogo</a>
    </div>
  </header>

  <main class="tracking">
    <div class="wrap tracking__wrap">
      <p class="eyebrow">Seguimiento</p>
      <h1>¿Cómo va tu pedido?</h1>
      <p class="lead">Ingresá el código que te enviamos por WhatsApp. Tiene el formato <strong>AG-XXXXXX</strong>.</p>

      <form class="tracking__form" id="trackingForm">
        <label for="trackingCode">Código de pedido</label>
        <div class="tracking__row">
          <input id="trackingCode" name="codigo" type="text" inputmode="text" autocomplete="off" placeholder="AG-ABC123" maxlength="12" required>
          <button class="btn btn--primary" type="submit">Buscar pedido</button>
        </div>
        <p class="tracking__status" id="trackingStatus" role="status" aria-live="polite"></p>
      </form>

      <section class="tracking__result" id="trackingResult" hidden aria-live="polite"></section>
    </div>
  </main>


  <footer class="tracking-footer">
    <div class="wrap tracking-footer__inner">
      <a class="logo" href="/" aria-label="Agresti.3D, inicio">
        <img class="logo__mark" src="/assets/logo/agresti-a.svg" alt="" width="40" height="40">
        <span class="logo__name">AGRESTI<span class="logo__dot">.3D</span></span>
      </a>
      <nav aria-label="Enlaces de seguimiento">
        <a href="/">Inicio</a>
        <a href="/#productos">Catálogo</a>
        <a href="/#pedido">Pedido a medida</a>
        <a href="mailto:agresti.3d@gmail.com">Email</a>
      </nav>
      <p>Hecho a pedido en Buenos Aires.</p>
    </div>
  </footer>

  <script src="/js/seguimiento.js?v=1"></script>
</body>
</html>
