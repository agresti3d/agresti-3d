    <script>
      (function () {
        try {
          var temaGuardado = localStorage.getItem("agresti:tema");
          if (temaGuardado === "claro") {
            document.documentElement.classList.add("theme-claro");
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute("content", "#dbc7b3");
          } else {
            // Sin preferencia guardada (navegador nuevo o datos borrados), oscuro por defecto.
            document.documentElement.classList.remove("theme-claro");
          }
        } catch (error) {}
      })();
    </script>
